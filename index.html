<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#262A31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Хэлхээ Сим">
<title>Хэлхээ угсрах симулятор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="csim-root" id="csimRoot">
  <div class="csim-toolbar">
    <button class="csim-tbtn" id="csimUndo" title="Буцах">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      <span>Буцах</span>
    </button>
    <div class="csim-wrap-rel">
      <button class="csim-tbtn" id="csimParts" title="Эд анги">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Эд анги</span>
      </button>
      <div class="csim-dropdown" id="csimPartsMenu">
        <button data-add="power"><span class="csim-swatch" style="background:#EF4444"></span>Тэжээлийн эх (L1 L2 L3 N PE)</button>
        <button data-add="psu24"><span class="csim-swatch" style="background:#3B82F6"></span>24В удирдлагын эх</button>
        <button data-add="breaker"><span class="csim-swatch" style="background:#3B82F6"></span>Автомат таслуур</button>
        <button data-add="button" data-color="#EF4444"><span class="csim-swatch" style="background:#EF4444"></span>Улаан товч (Зогсоох)</button>
        <button data-add="button" data-color="#22C55E"><span class="csim-swatch" style="background:#22C55E"></span>Ногоон товч (Эхлэх)</button>
        <button data-add="contactor"><span class="csim-swatch" style="background:#374151"></span>Магнит контактор</button>
        <button data-add="relay"><span class="csim-swatch" style="background:#F5A623"></span>Термик реле</button>
        <button data-add="estop"><span class="csim-swatch" style="background:#EF4444"></span>Аварийн зогсоолт</button>
        <button data-add="timer"><span class="csim-swatch" style="background:#F5A623"></span>Цагийн реле</button>
        <button data-add="motor"><span class="csim-swatch" style="background:#3a3f47"></span>3 фазын хөдөлгүүр</button>
        <button data-add="lamp"><span class="csim-swatch" style="background:#F5A623"></span>Индикатор гэрэл</button>
      </div>
    </div>
    <button class="csim-tbtn" id="csimSave" title="Хадгалах">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      <span>Хадгалах</span>
    </button>
    <button class="csim-tbtn" id="csimCheck" title="Шалгах">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Шалгах</span>
    </button>
    <div class="csim-wrap-rel">
      <button class="csim-tbtn" id="csimTemplates" title="Загварууд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <span>Загварууд</span>
      </button>
      <div class="csim-dropdown" id="csimTemplatesMenu">
        <button data-template="forward-reverse"><span class="csim-swatch" style="background:#22C55E"></span>Урагш-Хойш (Forward-Reverse)</button>
      </div>
    </div>
    <div class="csim-spacer"></div>
    <span id="csimUserEmail" class="csim-user-email"></span>
    <button class="csim-tbtn" id="csimLogout" title="Гарах">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Гарах</span>
    </button>
  </div>
  <div class="csim-hint">🔌 Терминалыг товшоод, нөгөө терминалыг товшиход холбогдоно (буруу/богино холболтыг зөвшөөрөхгүй, улаанаар анивчина). Эд ангиа зөөх/устгах бол дээр нь <b>удаан дараарай</b> (0.4 сек). Хоёр хуруугаараа чимхиж томруулна.</div>
  <div class="csim-canvas-wrap">
    <svg class="csim-svg" id="csimSvg" viewBox="0 0 800 1350" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="csimGrid" width="26" height="26" patternUnits="userSpaceOnUse">
          <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#E4E7EC" stroke-width="1"/>
        </pattern>
        <filter id="csimGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="csimShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#000000" flood-opacity="0.30"/>
        </filter>
        <linearGradient id="gradBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3d434c"/>
          <stop offset="55%" stop-color="#282c33"/>
          <stop offset="100%" stop-color="#1b1e23"/>
        </linearGradient>
        <linearGradient id="gradBodyOn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3f5a3a"/>
          <stop offset="55%" stop-color="#2c4028"/>
          <stop offset="100%" stop-color="#1b2a19"/>
        </linearGradient>
        <radialGradient id="gradCapGreen" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#8CF0B4"/>
          <stop offset="45%" stop-color="#22C55E"/>
          <stop offset="100%" stop-color="#0E6B34"/>
        </radialGradient>
        <radialGradient id="gradCapRed" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#FDB3B3"/>
          <stop offset="45%" stop-color="#EF4444"/>
          <stop offset="100%" stop-color="#8F1D1D"/>
        </radialGradient>
        <radialGradient id="gradTerm" cx="32%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="45%" stop-color="#E7E9EC"/>
          <stop offset="100%" stop-color="#A6ABB2"/>
        </radialGradient>
        <radialGradient id="gradMotor" cx="32%" cy="26%" r="80%">
          <stop offset="0%" stop-color="#656b74"/>
          <stop offset="55%" stop-color="#3c414a"/>
          <stop offset="100%" stop-color="#1f2226"/>
        </radialGradient>
        <linearGradient id="gradPanel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2f3742"/>
          <stop offset="100%" stop-color="#1a1f27"/>
        </linearGradient>
        <linearGradient id="gradSelector" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#60A5FA"/>
          <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <linearGradient id="gradBreakerBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FAFBFC"/>
          <stop offset="55%" stop-color="#E8EAED"/>
          <stop offset="100%" stop-color="#CDD1D6"/>
        </linearGradient>
        <linearGradient id="gradToggleOn" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7DB4FF"/>
          <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
      </defs>
      <rect id="csimBg" width="800" height="1350" fill="url(#csimGrid)"/>
      <g id="csimWorld">
        <g id="csimWiresLayer"></g>
        <g id="csimCompsLayer"></g>
        <g id="csimTempLayer"></g>
      </g>
    </svg>
    <div class="csim-sidebar">
      <button id="csimRedo" title="Дахих">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <button id="csimFit" title="Дэлгэцэнд багтаах">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="csimZoomOut" title="Жижигрүүлэх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
      </button>
      <button id="csimZoomIn" title="Томруулах">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
      </button>
      <button id="csimLock" title="Түгжих">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </button>
      <button id="csimClear" title="Цэвэрлэх">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>
    <div class="csim-toast" id="csimToast"></div>
    <div class="csim-report-overlay" id="csimReportOverlay">
      <div class="csim-report-panel">
        <div class="csim-report-head">
          <span>Схемийн шалгалт</span>
          <button id="csimReportClose" aria-label="Хаах">✕</button>
        </div>
        <div class="csim-report-body" id="csimReportBody"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/dom.js"></script>
<script src="js/state.js"></script>
<script src="js/simulate.js"></script>
<script src="js/render.js"></script>
<script src="js/check.js"></script>
<script src="js/storage.js"></script>
<script src="js/templates.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
